<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Page not found | Christophe Noret</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<meta name="darkreader-lock" />
		<link rel="icon" type="image/png" href="/images/favicon.png" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,600" />
		<script>
			(function() {
				var theme;
				try { theme = localStorage.getItem('theme'); } catch (e) {}
				if (theme !== 'light' && theme !== 'dark')
					theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.setAttribute('data-theme', theme);

				var lang;
				try { lang = localStorage.getItem('lang'); } catch (e) {}
				if (lang !== 'en' && lang !== 'fr') {
					var langs = navigator.languages || [navigator.language || 'en'];
					lang = String(langs[0] || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
				}
				document.documentElement.setAttribute('lang', lang);
			})();
		</script>
		<style>
			:root { --bg: #f4f8f9; --title: #0B1F2A; --text: #444; --muted: #5b676b; --accent: #008B9E; --accent-hover: #009fb5; }
			:root[data-theme="dark"] { --bg: #141b1f; --title: #eef3f5; --text: #b7c1c5; --muted: #8f9a9e; }
			* { box-sizing: border-box; }
			html { color-scheme: light; }
			:root[data-theme="dark"] { color-scheme: dark; }
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem 16px;
				background: var(--bg);
				color: var(--text);
				font-family: 'Source Sans Pro', sans-serif;
				font-weight: 300;
				text-align: center;
			}
			main { max-width: 34rem; }
			.code {
				margin: 0;
				color: var(--accent);
				font-weight: 600;
				font-size: 1rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0.4em 0 0.5em;
				color: var(--title);
				font-weight: 600;
				font-size: clamp(2rem, 6vw, 3rem);
				line-height: 1.1;
			}
			p { font-size: 1.2rem; line-height: 1.6; margin: 0 0 2rem; }
			a.button {
				display: inline-block;
				padding: 0.75em 2.2em;
				border-radius: 6px;
				background: var(--accent);
				color: #fff;
				font-weight: 600;
				font-size: 1.1rem;
				text-decoration: none;
				transition: background-color 0.25s ease;
			}
			a.button:hover { background: var(--accent-hover); }
			a.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
			.sign { margin-top: 2.5rem; font-size: 0.95rem; color: var(--muted); }
		</style>
	</head>
	<body>
		<main>
			<p class="code">Error 404</p>
			<h1>This page doesn't exist.</h1>
			<p>The link may be broken, or the page may have moved. Everything else is on the home page.</p>
			<a class="button" href="/">Back to home</a>
			<p class="sign">Christophe Noret · Data Analyst · Analytics Engineer</p>
		</main>
		<script>
			if (document.documentElement.getAttribute('lang') === 'fr') {
				document.title = 'Page introuvable | Christophe Noret';
				document.querySelector('.code').textContent = 'Erreur 404';
				document.querySelector('h1').textContent = 'Cette page n’existe pas.';
				document.querySelector('main > p:not(.code):not(.sign)').textContent = 'Le lien est peut-être cassé ou la page a été déplacée. Tout le reste est sur la page d’accueil.';
				document.querySelector('.button').textContent = 'Retour à l’accueil';
			}
		</script>
	</body>
</html>
